[package]
name = "regen-ssg"
version = "1.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Opinionated, reproducible multilingual static site generation with Tera and YAML"
license = "WTFPL"
readme = "README.md"
repository = "https://github.com/CritX-ai/ReGen"
homepage = "https://regen.critx.ai/"
documentation = "https://regen.critx.ai/"
keywords = ["static-site", "multilingual", "tera", "reproducible"]
categories = ["command-line-utilities", "web-programming"]
# Root-anchored, literal public files only: no generated output, recovery state,
# private website data, credentials, workflows, or build/tool caches.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/src/assets.rs",
    "/src/config.rs",
    "/src/content.rs",
    "/src/files.rs",
    "/src/hooks.rs",
    "/src/html.rs",
    "/src/lib.rs",
    "/src/main.rs",
    "/tests/generation.rs",
    "/tests/common/mod.rs",
    "/tests/windows_paths.rs",
    "/tests/unit/assets.rs",
    "/tests/unit/files.rs",
    "/tests/unit/rendering.rs",
    "/tests/unit/build_config.rs",
    "/tests/unit/hooks.rs",
    "/tests/unit/html.rs",
    "/tests/minification_assets.rs",
    "/examples/build_docs.rs",
    "/examples/deployment/wrangler.jsonc",
    "/examples/deployment/cloudflare-workers.sh",
    "/examples/deployment/github-pages.yml",
    "/examples/deployment/gitlab-pages.yml",
    "/examples/minimal/regen.toml",
    "/examples/minimal/hooks/report.py",
    "/examples/minimal/assets/mark.svg",
    "/examples/minimal/assets/site.css",
    "/examples/minimal/content/de/site.yaml",
    "/examples/minimal/content/de/pages/index.yaml",
    "/examples/minimal/content/en/site.yaml",
    "/examples/minimal/content/en/pages/index.yaml",
    "/examples/minimal/public/robots.txt",
    "/examples/minimal/templates/base.html",
    "/examples/minimal/templates/page.html",
    "/docs/guide.md",
    "/docs/reference.md",
    "/docs/architecture.md",
    "/docs/deployment.md",
    "/docs/license.md",
    "/docs/releasing.md",
    "/docs/testing.md",
    "/scripts/smoke.py",
    "/scripts/check_docs.py",
    "/scripts/project_logo.py",
    "/site/pages.json",
    "/site/templates/architecture.html",
    "/site/templates/page.html",
    "/site/templates/pipeline.html",
    "/site/templates/poem-example.html",
    "/site/templates/search.html",
    "/site/assets/docs.css",
    "/site/assets/critx-mark.svg",
    "/site/assets/github-mark.svg",
    "/site/assets/regen-logo.svg",
    "/site/assets/regen-logo-static.svg",
    "/site/assets/regen-mark.svg",
    "/site/assets/fonts/ibm-plex-mono-latin-400.woff2",
    "/site/assets/fonts/ibm-plex-sans-latin-variable.woff2",
    "/site/assets/fonts/ibm-plex-ofl.txt",
    "/site/assets/fonts/space-grotesk-latin-variable.woff2",
    "/site/assets/fonts/space-grotesk-ofl.txt",
    "/site/assets/fonts/provenance.json",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/regen-{ version }-{ target }.tar.gz"
bin-dir = "regen-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/regen-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/regen-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
name = "regen"

[[bin]]
name = "regen"
path = "src/main.rs"

[features]
default = ["minify-html", "minify-css", "minify-js"]
minify-html = ["dep:minify-html", "dep:scraper"]
minify-css = ["dep:lightningcss"]
minify-js = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_codegen", "dep:oxc_minifier", "dep:oxc_parser", "dep:oxc_semantic", "dep:oxc_span"]
hooks = []

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive"] }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, optional = true }
minify-html = { version = "=0.18.1", optional = true }
oxc_allocator = { version = "=0.95.0", optional = true }
oxc_ast = { version = "=0.95.0", optional = true }
oxc_codegen = { version = "=0.95.0", optional = true }
oxc_minifier = { version = "=0.95.0", optional = true }
oxc_parser = { version = "=0.95.0", optional = true }
oxc_semantic = { version = "=0.95.0", optional = true }
oxc_span = { version = "=0.95.0", optional = true }
scraper = { version = "=0.27.0", default-features = false, optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = { version = "=1.2.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.10.9"
tera = { version = "=2.4.0", default-features = false, features = ["preserve_order"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
url = "=2.5.8"
walkdir = "=2.5.0"

[dev-dependencies]
tempfile = "=3.27.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
scraper = { version = "=0.27.0", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
