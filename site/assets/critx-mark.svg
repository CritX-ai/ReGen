<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">CritX.ai Proof Gate animated mark</title>
  <desc id="desc">Two independent signal routes converge on an accountable central gate.</desc>
  <metadata>
