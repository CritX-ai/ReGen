<svg xmlns="http://www.w3.org/2000/svg" width="420" height="145" viewBox="0 0 504 174" role="img" aria-labelledby="title description">
  <title id="title">ReGen — Rust-powered reproducible generation</title>
  <desc id="description">A copper-gradient R anchors silver eGen letters. Cyan strokes flow through eGen in motion; the static composition keeps the G-upper-arch highlight and its fading trail in the first e and G, leaving the final e and n plain silver.</desc>
  <metadata>Lettering based on Space Grotesk, weight 700, tracking -0.04em; custom R with a broad stem, chamfered crown, and diagonal leg. Source WOFF2 SHA256: 0640890476fc1198ab4de571fb658de443c4d85b66466ec09534a8737ab1ce9d. Original wordmark artwork; not the Rust project logo. Static keyframe at 557.349438889 ms; forward head at 236.670327020 of 1000 path units, coordinate (286, 68). Bright segment: 110 units. Additional fading tail: 220 units. Selected static option B. Static trail restricted to the first e and G; final e and n remain silver.</metadata>
  <style>
    @keyframes regeneration { to { stroke-dashoffset: -1000; } }
    @keyframes copper-shade { 0%, 100% { stop-color: #BE7C52; } 50% { stop-color: #D4986C; } }
    @keyframes copper-light { 0%, 100% { stop-color: #DFA173; } 50% { stop-color: #C8875E; } }
    @media screen and (prefers-reduced-motion: no-preference) {
      .static-trail { display: none; }
      .moving-parts { display: inline; }
      .flow { animation: regeneration 4.4s linear infinite; }
      .copper-shade { animation: copper-shade 4.4s ease-in-out infinite; }
      .copper-light { animation: copper-light 4.4s ease-in-out infinite; }
    }
  </style>
