<dialog id="docs-search-dialog" class="docs-search-dialog" aria-labelledby="docs-search-title">
  <div class="docs-search-heading">
    <h2 id="docs-search-title">Search docs</h2>
    <form method="dialog">
      <button class="docs-search-button" type="submit">Close</button>
    </form>
  </div>
  <label class="docs-search-label" for="docs-search-input">Search words</label>
  <input id="docs-search-input" class="docs-search-input" type="search" autocomplete="off" spellcheck="false" aria-describedby="docs-search-help" aria-controls="docs-search-results" autofocus>
  <p id="docs-search-help" class="docs-search-help">All words must match. Enter opens the first result.</p>
  <p id="docs-search-status" class="docs-search-status" role="status" aria-live="polite" aria-atomic="true">Type a topic, setting, or command to begin.</p>
  <ol id="docs-search-results" class="docs-search-results" aria-label="Search results"></ol>
</dialog>
<script id="docs-search-index" type="application/json">{{ site.search_index | safe }}</script>
<script id="docs-search-script">
(() => {
  "use strict";

  function revealFragment(hash = window.location.hash, scroll = false) {
    if (!hash) return;
    let id;
    try {
      id = decodeURIComponent(hash.slice(1));
    } catch {
      return;
    }
    const target = document.getElementById(id);
    if (!target) return;
    let scrollTarget = target;
    let expanded = false;
    for (let panel = target; panel; panel = panel.parentElement) {
      if (!panel.id) continue;
      const control = document.querySelector(`input[type="radio"][aria-controls~="${CSS.escape(panel.id)}"]`);
      if (!control) continue;
      if (!control.checked) {
        control.checked = true;
        expanded = true;
      }
      if (!target.getClientRects().length) scrollTarget = control.closest("fieldset") || panel;
    }
    const disclosures = [];
    if (/^H[1-6]$/.test(target.tagName)) {
      for (let sibling = target.nextElementSibling; sibling && !/^H[1-6]$/.test(sibling.tagName); sibling = sibling.nextElementSibling) {
        if (sibling.matches("details")) disclosures.push(sibling);
        disclosures.push(...sibling.querySelectorAll("details"));
      }
    }
    for (let detail = target.closest("details"); detail; detail = detail.parentElement?.closest("details")) {
      if (!detail.open) {
        detail.open = true;
        expanded = true;
      }
    }
    for (const detail of disclosures) {
      if (!detail.open) {
        detail.open = true;
        expanded = true;
      }
    }
    if (expanded || scroll || scrollTarget !== target) scrollTarget.scrollIntoView({ block: "start", behavior: "instant" });
  }

  revealFragment();
  window.addEventListener("hashchange", () => revealFragment());

  const trigger = document.getElementById("docs-search-open");
  const dialog = document.getElementById("docs-search-dialog");
  const input = document.getElementById("docs-search-input");
  const results = document.getElementById("docs-search-results");
  const status = document.getElementById("docs-search-status");
  if (typeof dialog.showModal !== "function") return;

  const normalize = (text) => text.toLowerCase().trim().replace(/\s+/g, " ");
  let entries;
  try {
    const index = JSON.parse(document.getElementById("docs-search-index").textContent);
    if (!Array.isArray(index)) return;
    entries = index.flatMap((entry, order) => {
      if (!entry || ![entry.title, entry.heading, entry.url, entry.text].every((value) => typeof value === "string")) return [];
      const url = new URL(entry.url, window.location.href);
      if (url.origin !== window.location.origin || !["http:", "https:"].includes(url.protocol) || url.username || url.password) return [];
      return [{
        title: entry.title,
        heading: entry.heading,
        url: url.href,
        text: entry.text,
        titleMatch: normalize(entry.title),
        headingMatch: normalize(entry.heading),
        textMatch: entry.text.toLowerCase(),
        order
      }];
    });
  } catch {
    return;
  }
  if (!entries.length) return;

  const limit = 12;
  let composing = false;

  function snippet(entry, tokens) {
    let match = entry.text.length;
    for (const token of tokens) {
      const position = entry.textMatch.indexOf(token);
      if (position !== -1) match = Math.min(match, position);
    }
    let start = match === entry.text.length ? 0 : Math.max(0, match - 55);
    if (start > 0) {
      const boundary = entry.text.lastIndexOf(" ", start);
      if (boundary !== -1) start = boundary + 1;
    }
    let end = Math.min(entry.text.length, start + 190);
    if (end < entry.text.length) {
      const boundary = entry.text.lastIndexOf(" ", end);
      if (boundary > start) end = boundary;
    }
    return (start ? "…" : "") + entry.text.slice(start, end).trim() + (end < entry.text.length ? "…" : "");
  }

  function search() {
    const query = normalize(input.value);
    results.replaceChildren();
    if (!query) {
      status.textContent = "Type a topic, setting, or command to begin.";
      return;
    }
    const tokens = [...new Set(query.split(" "))];
    const matches = [];
    for (const entry of entries) {
      let headings = 0;
      let titles = 0;
      let body = 0;
      let matched = true;
      for (const token of tokens) {
        const inHeading = entry.headingMatch.includes(token);
        const inTitle = entry.titleMatch.includes(token);
        const inBody = entry.textMatch.includes(token);
        if (!inHeading && !inTitle && !inBody) {
          matched = false;
          break;
        }
        headings += Number(inHeading);
        titles += Number(inTitle);
        body += Number(inBody);
      }
      if (matched) matches.push({ entry, exact: Number(entry.headingMatch === query || entry.titleMatch === query), headings, titles, body });
    }
    matches.sort((a, b) => b.exact - a.exact || b.headings - a.headings || b.titles - a.titles || b.body - a.body || a.entry.order - b.entry.order);
    if (!matches.length) {
      status.textContent = "No matches. Try fewer words or a different term.";
      return;
    }
    status.textContent = matches.length > limit
      ? `${matches.length} results. Showing the first ${limit}; add words to narrow your search.`
      : `${matches.length} ${matches.length === 1 ? "result" : "results"}.`;
    const fragment = document.createDocumentFragment();
    for (const { entry } of matches.slice(0, limit)) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.className = "docs-search-result";
      link.href = entry.url;
      const heading = document.createElement("span");
      heading.className = "docs-search-result-title";
      heading.textContent = entry.heading || entry.title;
      link.append(heading);
      if (entry.heading && entry.heading !== entry.title) {
        const page = document.createElement("span");
        page.className = "docs-search-result-page";
        page.textContent = entry.title;
        link.append(page);
      }
      if (entry.text) {
        const context = document.createElement("span");
        context.className = "docs-search-result-snippet";
        context.textContent = snippet(entry, tokens);
        link.append(context);
      }
      item.append(link);
      fragment.append(item);
    }
    results.append(fragment);
    dialog.scrollTop = 0;
  }

  function openSearch() {
    if (!dialog.open) dialog.showModal();
    input.focus();
    input.select();
  }

  trigger.addEventListener("click", openSearch);
  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend", () => { composing = false; search(); });
  input.addEventListener("input", (event) => {
    if (!composing && !event.isComposing) search();
  });
  input.addEventListener("keydown", (event) => {
    if (composing || event.isComposing || event.keyCode === 229) return;
    if (event.key === "Enter" && !event.ctrlKey && !event.metaKey && !event.altKey && !event.shiftKey) {
      event.preventDefault();
      results.querySelector("a")?.click();
    }
  });
  document.addEventListener("keydown", (event) => {
    if (event.defaultPrevented || composing || event.isComposing || event.keyCode === 229) return;
    if (event.key === "Escape" && dialog.open) {
      event.preventDefault();
      dialog.close();
      return;
    }
    if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "k") {
      event.preventDefault();
      openSearch();
    }
  });
  results.addEventListener("click", (event) => {
    const link = event.target.closest("a");
    if (!link) return;
    dialog.close();
    if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const url = new URL(link.href);
    if (url.pathname === window.location.pathname && url.search === window.location.search) revealFragment(url.hash, true);
  });
  trigger.hidden = false;
})();
</script>
