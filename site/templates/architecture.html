          <desc id="architecture-mobile-description">Local inputs flow through validation and routing. Templates, assets and public files join in a stage. Installation replaces dist using two renames. Select a node to read the details below.</desc>
          <defs><marker id="architecture-mobile-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L7 4L0 8Z"/></marker></defs>
          <g class="architecture-wires" marker-end="url(#architecture-mobile-arrow)"><path d="M170 68V96"/><path d="M170 160V188"/><path d="M170 252V324"/><path d="M62 305V324"/><path d="M278 305V324"/><path d="M170 388V420"/></g>
          <a class="architecture-inspect" data-node="1" href="#invariants-worth-knowing" aria-label="Local source inputs" aria-describedby="overview-note-1"><g class="architecture-svg-source"><rect x="24" y="16" width="292" height="52"/><text x="170" y="48" text-anchor="middle">TOML + localized YAML</text></g></a>
          <a class="architecture-inspect" data-node="6" href="#invariants-worth-knowing" aria-label="Validate inputs" aria-describedby="overview-note-6"><g class="architecture-svg-gate"><path d="M65 100H275L295 130L275 160H65L45 130Z"/><text x="170" y="136" text-anchor="middle">Validate</text></g></a>

          <a class="architecture-inspect" data-node="5" href="#invariants-worth-knowing" aria-label="Public files" aria-describedby="overview-note-5"><text class="architecture-svg-port" x="278" y="292" text-anchor="middle">public/</text></a>
          <a class="architecture-inspect" data-node="8" href="#output-ownership-and-interruption-recovery" aria-label="Prepare sibling stage" aria-describedby="overview-note-8"><g class="architecture-svg-stage"><path d="M24 328H294L316 350V388H24Z"/><text x="170" y="365" text-anchor="middle">.regen-stage/</text></g></a>
          <a class="architecture-inspect" data-node="9" href="#output-ownership-and-interruption-recovery" aria-label="Install completed output" aria-describedby="overview-note-9"><g class="architecture-svg-output"><rect x="76" y="424" width="188" height="48"/><text x="170" y="455" text-anchor="middle">dist/</text></g></a>
        </svg>
        <figcaption class="architecture-readout">
          <span class="architecture-caption-default">Prepare beside the old site. Replace only when the new build is complete.</span>
          <span class="architecture-note" data-for="1" id="overview-note-1"><strong>Local inputs.</strong> TOML defines the URL, languages and paths; localized YAML supplies the content. Generation makes no network requests.</span>
          <span class="architecture-note" data-for="2" id="overview-note-2"><strong>Explicit translations.</strong> Every language supplies the same page IDs. Slugs can differ; missing translations fail.</span>
          <span class="architecture-note" data-for="3" id="overview-note-3"><strong>Tera templates.</strong> Local HTML templates render with content and localized URL context; there is no plugin host.</span>
          <span class="architecture-note" data-for="4" id="overview-note-4"><strong>Assets.</strong> Minify standalone CSS, preserve JavaScript and media, then fingerprint the complete asset tree.</span>
          <span class="architecture-note" data-for="5" id="overview-note-5"><strong>Public files.</strong> Copy bytes unchanged to stable paths. No optimization or sanitization.</span>
          <span class="architecture-note" data-for="6" id="overview-note-6"><strong>Fail on ambiguity.</strong> Reject invalid configuration, layouts, duplicate keys, unsafe paths and incomplete translations.</span>
          <span class="architecture-note" data-for="7" id="overview-note-7"><strong>Identity becomes a route.</strong> Pair page IDs across languages, then derive each localized URL from its slug.</span>
          <span class="architecture-note" data-for="8" id="overview-note-8"><strong>Sibling stage.</strong> Templates render HTML here; assets and public files join it. Write the sitemap and manifest last. Old output stays untouched.</span>
          <span class="architecture-note" data-for="9" id="overview-note-9"><strong>Install.</strong> Two renames promote the completed stage. The brief absent-dist window is not an atomic exchange.</span>
          <span class="architecture-note" data-for="10" id="overview-note-10"><strong>Previous output.</strong> Move it aside only after preparation. Retain it for attempted rollback until promotion succeeds.</span>
        </figcaption>
      </figure>

          <a class="architecture-inspect" data-node="5" href="#input-model" aria-describedby="crate-note-5"><g class="architecture-svg-route"><rect x="124" y="252" width="92" height="60"/><text x="170" y="287" text-anchor="middle">content.rs</text></g></a>

        <figcaption class="architecture-readout">
          <span class="architecture-caption-default">Arrows mean “depends on.” Green separates the docs entry and direct filesystem call from the other module dependencies.</span>
          <span class="architecture-note" data-for="1" id="crate-note-1"><strong>CLI boundary.</strong> Clap parses the command; main calls the same library API available to Rust consumers. No second build implementation.</span>
          <span class="architecture-note" data-for="2" id="crate-note-2"><strong>Repository-only preprocessing.</strong> The docs example converts Markdown and prepares inputs, then calls build(). It is not part of the installed generator.</span>
          <span class="architecture-note" data-for="3" id="crate-note-3"><strong>Build coordinator.</strong> lib.rs prepares template context, renders pages, copies public files and writes the sitemap and manifest before installing the finished site.</span>
          <span class="architecture-note" data-for="4" id="crate-note-4"><strong>Configuration.</strong> config.rs reads TOML and checks the URL, languages and source paths before the build uses them.</span>
          <span class="architecture-note" data-for="5" id="crate-note-5"><strong>Content.</strong> content.rs validates the locale inventory and YAML, pairs page identities and derives routes. It also consumes config.rs’s language/URL model.</span>
          <span class="architecture-note" data-for="6" id="crate-note-6"><strong>Assets.</strong> assets.rs owns CSS optimization and length-prefixed streaming hashes. Keeping this byte pipeline separate avoids mixing rendering with cache identity.</span>
          <span class="architecture-note" data-for="7" id="crate-note-7"><strong>Filesystem boundary.</strong> files.rs centralizes portable names, bounded reads, exclusive writes, staging and recovery. All callers share the same protection rules.</span>
        </figcaption>
      </figure>

      <figure class="architecture-panel architecture-panel-input" id="architecture-panel-input" aria-labelledby="architecture-input-title">
        <h3 id="architecture-input-title">Ambiguity stops here.</h3>
        <div class="architecture-input-diagram">
          <div class="architecture-input-streams">
            <a class="architecture-inspect" data-node="1" href="#invariants-worth-knowing" aria-describedby="input-note-1"><code>regen.toml</code></a>
            <a class="architecture-inspect" data-node="2" href="#invariants-worth-knowing" aria-describedby="input-note-2"><code>content/</code></a>
            <a class="architecture-inspect" data-node="3" href="#trust-and-scope" aria-describedby="input-note-3"><strong>Source files</strong></a>
          </div>
          <a class="architecture-gate-node architecture-inspect" data-node="4" href="#invariants-worth-knowing" aria-describedby="input-note-4"><strong>Validate</strong></a>
          <div class="architecture-gate-outcomes">
            <a class="architecture-pass architecture-inspect" data-node="5" href="#output-ownership-and-interruption-recovery" aria-describedby="input-note-5"><strong>Prepare</strong></a>
            <a class="architecture-stop architecture-inspect" data-node="6" href="#output-ownership-and-interruption-recovery" aria-describedby="input-note-6"><strong>Error</strong></a>
          </div>
        </div>
        <figcaption class="architecture-readout">
          <span class="architecture-caption-default">One valid interpretation — or a build error.</span>
          <span class="architecture-note" data-for="1" id="input-note-1"><strong>Configuration.</strong> Validate the HTTP(S) base URL, configured languages and portable source paths.</span>
          <span class="architecture-note" data-for="2" id="input-note-2"><strong>Content.</strong> Typed YAML, unique keys, matching translation IDs and one home page per language.</span>
          <span class="architecture-note" data-for="3" id="input-note-3"><strong>Local files.</strong> Templates and optional assets/public trees admit no symlinks or special files.</span>
          <span class="architecture-note" data-for="4" id="input-note-4"><strong>No guessing.</strong> No YAML includes, ignored content directories or fallback translations.</span>
          <span class="architecture-note" data-for="5" id="input-note-5"><strong>Continue into preparation.</strong> Invalid templates, CSS and output collisions can still stop the build before installation.</span>
          <span class="architecture-note" data-for="6" id="input-note-6"><strong>No replacement.</strong> A pre-install error leaves old output in place and attempts to remove only this invocation’s stage.</span>
        </figcaption>
      </figure>

      <figure class="architecture-panel architecture-panel-routes" id="architecture-panel-routes" aria-labelledby="architecture-routes-title">
        <h3 id="architecture-routes-title">One identity. Two addresses.</h3>
        <div class="architecture-pair-diagram">
          <a class="architecture-pair-source architecture-inspect" data-node="1" href="#invariants-worth-knowing" aria-describedby="route-note-1"><strong>English</strong><code>about.yaml</code></a>
          <a class="architecture-pair-source architecture-inspect" data-node="2" href="#invariants-worth-knowing" aria-describedby="route-note-2"><strong>German</strong><code>about.yaml</code></a>
          <a class="architecture-identity architecture-inspect" data-node="3" href="#invariants-worth-knowing" aria-describedby="route-note-3"><strong>about</strong></a>
          <a class="architecture-route-destination architecture-inspect" data-node="4" href="#hosting-paths-are-not-disk-paths" aria-describedby="route-note-4"><strong>/about/</strong></a>
          <a class="architecture-route-destination architecture-inspect" data-node="5" href="#hosting-paths-are-not-disk-paths" aria-describedby="route-note-5"><strong>/de/ueber/</strong></a>
        </div>
        <figcaption class="architecture-readout">
          <span class="architecture-caption-default">Match by page ID, not by slug. English is the default in this example.</span>
          <span class="architecture-note" data-for="1" id="route-note-1"><strong>English source.</strong> en/pages/about.yaml declares slug: about.</span>
          <span class="architecture-note" data-for="2" id="route-note-2"><strong>German source.</strong> de/pages/about.yaml declares slug: ueber. Missing this page stops the build.</span>
          <span class="architecture-note" data-for="3" id="route-note-3"><strong>Shared identity.</strong> The path beneath pages/, without .yaml, pairs translations. Their words and slugs can differ.</span>
          <span class="architecture-note" data-for="4" id="route-note-4"><strong>Default-language route.</strong> /about/ is written to dist/about/index.html.</span>
          <span class="architecture-note" data-for="5" id="route-note-5"><strong>Localized route.</strong> /de/ueber/ is written to dist/de/ueber/index.html. A hosting prefix changes URLs, not these disk paths.</span>
        </figcaption>
      </figure>

      <figure class="architecture-panel architecture-panel-stage" id="architecture-panel-stage" aria-labelledby="architecture-stage-title">
        <h3 id="architecture-stage-title">All new bytes meet in the stage.</h3>
        <div class="architecture-stage-diagram">
          <div class="architecture-transform-lane">
            <a class="architecture-inspect" data-node="1" href="#invariants-worth-knowing" aria-describedby="stage-note-1"><code>assets/</code></a>
            <a class="architecture-inspect" data-node="2" href="#invariants-worth-knowing" aria-describedby="stage-note-2"><strong>Optimize + hash</strong></a>
            <a class="architecture-inspect" data-node="3" href="#invariants-worth-knowing" aria-describedby="stage-note-3"><code>assets/&lt;digest&gt;/</code></a>
          </div>
          <div class="architecture-transform-lane">
            <a class="architecture-inspect" data-node="4" href="#invariants-worth-knowing" aria-describedby="stage-note-4"><code>public/</code></a>
            <a class="architecture-inspect" data-node="5" href="#invariants-worth-knowing" aria-describedby="stage-note-5"><strong>Copy</strong></a>
            <a class="architecture-inspect" data-node="6" href="#invariants-worth-knowing" aria-describedby="stage-note-6"><code>stable paths</code></a>
          </div>
          <div class="architecture-transform-lane">
            <a class="architecture-inspect" data-node="7" href="#invariants-worth-knowing" aria-describedby="stage-note-7"><strong>Tera + content</strong></a>
            <a class="architecture-inspect" data-node="8" href="#invariants-worth-knowing" aria-describedby="stage-note-8"><strong>Render + minify</strong></a>
            <a class="architecture-inspect" data-node="9" href="#invariants-worth-knowing" aria-describedby="stage-note-9"><code>…/index.html</code></a>
          </div>
          <a class="architecture-seal architecture-inspect" data-node="10" href="#invariants-worth-knowing" aria-describedby="stage-note-10"><strong>Seal .regen-stage/</strong></a>
        </div>
        <figcaption class="architecture-readout">
          <span class="architecture-caption-default">Three paths in. One complete output tree.</span>
          <span class="architecture-note" data-for="1" id="stage-note-1"><strong>Asset inputs.</strong> Standalone CSS, JavaScript and media live in the same versioned tree.</span>
          <span class="architecture-note" data-for="2" id="stage-note-2"><strong>Selective optimization.</strong> Minify standalone CSS only. Hash sorted paths, explicit lengths and final bytes.</span>
          <span class="architecture-note" data-for="3" id="stage-note-3"><strong>One tree digest.</strong> Any changed asset invalidates the complete tree. Sibling paths survive.</span>
          <span class="architecture-note" data-for="4" id="stage-note-4"><strong>Public inputs.</strong> Files that need stable, unhashed paths.</span>
          <span class="architecture-note" data-for="5" id="stage-note-5"><strong>Byte-preserving copy.</strong> No transformation, optimization or sanitization.</span>
          <span class="architecture-note" data-for="6" id="stage-note-6"><strong>Stable destinations.</strong> Public files retain their relative paths; collisions fail.</span>
          <span class="architecture-note" data-for="7" id="stage-note-7"><strong>Local rendering.</strong> Templates receive localized content and URL context.</span>
          <span class="architecture-note" data-for="8" id="stage-note-8"><strong>HTML preparation.</strong> Render Tera, then minify the resulting HTML document.</span>
          <span class="architecture-note" data-for="9" id="stage-note-9"><strong>Page output.</strong> Comments are retained. Inline CSS/JavaScript are not separately minified; surrounding whitespace can change.</span>
          <span class="architecture-note" data-for="10" id="stage-note-10"><strong>Write last.</strong> sitemap.xml, then regen-manifest.json: sorted hashes and byte counts, excluding the manifest itself.</span>
        </figcaption>
      </figure>

      <figure class="architecture-panel architecture-panel-replace" id="architecture-panel-replace" aria-labelledby="architecture-replace-title">
        <h3 id="architecture-replace-title">Follow the directories.</h3>
        <table class="architecture-replacement-table" aria-label="Directory state after each step of replacing a recognized ReGen build">
          <thead><tr><th scope="col">Step</th><th scope="col">Old build</th><th scope="col">New build</th></tr></thead>
          <tbody>
            <tr>
              <th scope="row"><a class="architecture-operation architecture-inspect" data-node="1" href="#output-ownership-and-interruption-recovery" aria-describedby="replace-note-1">1. Prepare</a></th>
              <td><code>dist/</code></td>
              <td><code>.regen-<wbr>stage/</code></td>
            </tr>
            <tr>
              <th scope="row"><a class="architecture-operation architecture-inspect" data-node="2" href="#output-ownership-and-interruption-recovery" aria-describedby="replace-note-2">2. Rename old</a><span class="architecture-dist-gap">dist/ absent</span></th>
              <td><code>.regen-<wbr>previous/</code></td>
              <td><code>.regen-<wbr>stage/</code></td>
            </tr>
            <tr>
              <th scope="row"><a class="architecture-operation architecture-inspect" data-node="3" href="#output-ownership-and-interruption-recovery" aria-describedby="replace-note-3">3. Promote stage</a></th>
              <td><code>.regen-<wbr>previous/</code></td>
              <td><code>dist/</code></td>
            </tr>
            <tr>
              <th scope="row"><a class="architecture-operation architecture-inspect" data-node="4" href="#output-ownership-and-interruption-recovery" aria-describedby="replace-note-4">4. Remove old</a></th>
              <td><span class="architecture-removed">Removed</span></td>
              <td><code>dist/</code></td>
            </tr>
          </tbody>
        </table>
        <figcaption class="architecture-readout">
          <span class="architecture-caption-default">Two renames. An explicit gap. Recovery stays inspectable.</span>
          <span class="architecture-note" data-for="1" id="replace-note-1"><strong>Prepare.</strong> Old dist/ remains untouched while the new site is built in its sibling stage.</span>
          <span class="architecture-note" data-for="2" id="replace-note-2"><strong>Move old output aside.</strong> Rename dist/ to .regen-previous/. Until promotion, dist/ is absent — not an atomic exchange.</span>
          <span class="architecture-note" data-for="3" id="replace-note-3"><strong>Promote.</strong> Rename the completed stage to dist/. If promotion fails, attempt to restore the old tree.</span>
          <span class="architecture-note" data-for="4" id="replace-note-4"><strong>Clean up.</strong> Remove the backup only after promotion. Cleanup failure means the new site may already be installed; inspect recovery state.</span>
        </figcaption>
      </figure>
    </div>
  </fieldset>
</section>
