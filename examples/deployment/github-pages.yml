# Copy to .github/workflows/pages.yml in your site's repository.
# Set Settings > Pages > Source to GitHub Actions.
# Commit the actual public URL (including any project prefix) as site.base_url.
name: Deploy ReGen site to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: regen-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Read configured Pages metadata
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Install ReGen
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 install regen-ssg --version 1.1.1 --locked
      - name: Build the site
        run: regen build --site . --profile release
      - name: Upload only the generated site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          name: github-pages
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the generated artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
